<template id="hatchet-template">
  <!-- "A hatchetfish lights up its belly to match the faint glow from above. Seen from below, its silhouette vanishes."
       Side view: the belly lights come on under the faint light from above. Then a hungry fish below looks up:
       lights off, the hatchetfish is a dark shape against the light; lights on, the shape melts into the light.
       The light behind the fish is flat in the middle, so a silhouette filled with its colour (C) disappears. -->
  <div data-composition-id="hatchet" data-width="1080" data-height="1920" data-duration="7.26">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KO = window.OCEAN;
        const ID = "hatchet", R = document.querySelector('[data-composition-id="hatchet"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, rnd = K.rng(51);
        const S = KO.scene(R, ID, { bg: ["#1d5a96", "#0b3168", "#041633"] });
        const HX = 540, HY = 430, C = "#69b8e2";

        // ---------------------------------------------------------------- the light from above (moves 1:1 with the fish)
        const wg = K.el("radialGradient", { id: `${S.p}-win`, cx: 0.5, cy: 0.5, r: 0.5 }, S.defs);
        [[0, 1], [0.22, 0.97], [0.5, 0.55], [0.78, 0.15], [1, 0]].forEach(([o, a]) => K.el("stop", { offset: o, "stop-color": C, "stop-opacity": a }, wg));
        const win = K.el("ellipse", { cx: HX, cy: HY - 40, rx: 980, ry: 860, fill: `url(#${S.p}-win)`, opacity: 0.55 }, S.act);
        const rays = KO.rays(S.mid, { p: S.p, defs: S.defs, n: 7, y: -200, len: 1500, x0: 60, x1: 960, seed: 52 });
        rays.setAttribute("opacity", 0.45);
        tl.to(rays, { x: 30, duration: DUR, ease: "sine.inOut" }, 0);
        const snow = KO.snow(S.mid, { n: 130, seed: 53, a: 0.35 });
        tl.to(snow, { y: 50, duration: DUR, ease: "none" }, 0);
        // far school of hatchetfish shapes for depth (outline taken from a throwaway instance)
        const tmpG = K.g(S.far), SH = KO.hatchet(tmpG, { L: 340, p: S.p }).shapes;
        tmpG.remove();
        for (let i = 0; i < 9; i++) {
          const g = K.g(S.far, { transform: `translate(${f(-80 + rnd() * 1240)},${f(150 + rnd() * 1300)}) scale(${f(0.2 + rnd() * 0.18)})`, opacity: 0.22 });
          SH.forEach((d) => K.el("path", { d, fill: "#0c2d5c" }, g));
        }
        for (let i = 0; i < 6; i++) KP.softDot(S.near, rnd() * 1080, rnd() * 1920, 30 + rnd() * 50, `${S.p}-gl-cyan`, 0.08 + rnd() * 0.1);

        // ---------------------------------------------------------------- the hungry fish below (drawn first: behind)
        const pw = K.g(S.act);
        const pred = KO.fish(pw, { L: 430, pal: KO.C.big, p: S.p, teeth: true, eyeR: 34, seed: 7 });
        const P0 = [170, 1700], P1 = [330, 1040], ROT = -32;
        gsap.set(pw, { x: P0[0], y: P0[1], rotation: ROT, svgOrigin: "0 0" });
        pred.eye.lx = 0.75; pred.eye.ly = -0.66; pred.eye.update();

        // ---------------------------------------------------------------- the hatchetfish
        const hw = K.g(S.act, { transform: `translate(${HX},${HY})` }), hb = K.g(hw);
        const belly = KO.glow(hb, { x: 0, y: 150, r: 300, color: "cyan", p: S.p, core: 0, k: 0 });
        const hat = KO.hatchet(hb, { L: 340, p: S.p });
        const silM = hat.silhouette(hat.g, C);           // window colour
        const silD = hat.silhouette(hat.g, "#0a1a33");   // dark: unlit, seen against the light
        hat.photos.forEach((ph) => hat.g.appendChild(ph.g));                                 // lights stay on top
        const lights = { k: 0 };
        const setLights = () => { hat.k = lights.k; hat.update(); belly.k = lights.k * 0.5 * (1 - sil.v); belly.update(); };
        const sil = { v: 0 };

        // ---------------------------------------------------------------- side view: the belly lights come on
        gsap.set(S.cam, { px: HX, py: HY + 80, s: 1.32 }); S.cam.apply();
        K.camTo(tl, S.cam, 0, { s: 1.38, py: HY + 60 }, at("seen") - 0.35, "sine.inOut");
        const tag = S.cam.pin(K.tag(S.ui, { text: "Hatchetfish", x: 0, y: 0, color: "ocean", size: 56 }), HX, HY - 140);
        K.show(tl, tag, at("hatchetfish") + 0.05);
        K.hide(tl, tag, at("faint") - 0.15);
        tl.to(lights, { k: 1.1, duration: 0.45, ease: "power2.out", onUpdate: setLights }, at("lights") - 0.05);
        KP.eyeTo(tl, hat.eye, at("lights"), { ly: 0.6, lx: 0.1 }, 0.25);           // looks down at its own glowing belly
        KP.eyeTo(tl, hat.eye, at("match") + 0.1, { ly: -0.85, lx: 0.2 }, 0.3);     // then up at the light
        // "faint glow from above": light drifting down from the window
        const chev = K.g(S.act, { fill: "none", stroke: "#e6fdff", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" });
        [[-130, 0], [0, -40], [130, 0]].forEach(([dx, dy], i) => {
          const c = K.el("path", { d: `M ${HX + dx - 26} ${HY - 250 + dy} l 26 22 l 26 -22`, opacity: 0 }, chev);
          tl.fromTo(c, { opacity: 0, y: -30 }, { opacity: 0.85, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, at("glow") - 0.1 + i * 0.08);
          tl.to(c, { y: 50, opacity: 0, duration: 0.5, ease: "power1.in" }, at("above") + 0.25 + i * 0.06);
        });

        // ---------------------------------------------------------------- "Seen from below": the view of the hungry fish
        const tS = at("seen") - 0.3;
        K.camTo(tl, S.cam, tS, { px: 540, py: 960, s: 1.0 }, 0.85, "power2.inOut");
        tl.to(pw, { x: P1[0], y: P1[1], duration: 0.9, ease: "power2.out" }, tS);
        tl.to(win, { attr: { opacity: 1 }, duration: 0.6, ease: "power2.inOut" }, tS + 0.1);
        tl.to(sil, { v: 1, duration: 0.3, ease: "power2.inOut", onUpdate: () => { silM.setAttribute("opacity", f(sil.v)); silD.setAttribute("opacity", f(sil.v)); setLights(); } }, at("seen") + 0.05);
        tl.to(lights, { k: 0, duration: 0.2, ease: "power2.in", onUpdate: setLights }, at("seen") + 0.05);
        // line of sight from its eye and a lock-on ring
        const eyeW = (() => { const a = ROT * Math.PI / 180, ex = 0.27 * 430, ey = -0.07 * 430 * 0.46; return [P1[0] + ex * Math.cos(a) - ey * Math.sin(a), P1[1] + ex * Math.sin(a) + ey * Math.cos(a)]; })();
        const los = K.el("path", { d: `M ${f(eyeW[0])} ${f(eyeW[1])} L ${HX - 10} ${HY + 175}`, fill: "none", stroke: "#ffd8e0", "stroke-width": 7, "stroke-dasharray": "4 22", "stroke-linecap": "round", opacity: 0 }, S.act);
        const lock = K.g(S.act, { transform: `translate(${HX},${HY + 20})`, opacity: 0 });
        K.el("circle", { r: 250, fill: "none", stroke: "#ff6b81", "stroke-width": 8, "stroke-dasharray": "60 40" }, lock);
        [0, 90, 180, 270].forEach((a) => K.el("path", { d: "M 0 -280 L 0 -222", stroke: "#ff6b81", "stroke-width": 10, "stroke-linecap": "round", transform: `rotate(${a})` }, lock));
        const tB = at("below");
        tl.to(los, { opacity: 0.9, duration: 0.25 }, tB);
        tl.fromTo(lock, { opacity: 0, scale: 1.4, svgOrigin: "0 0" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, tB + 0.1);
        KP.eyeTo(tl, pred.eye, tB, { lid: 0.3 }, 0.2);
        KP.eyeTo(tl, hat.eye, tB + 0.2, { fear: 1 }, 0.15);

        // ---------------------------------------------------------------- "its silhouette vanishes": lights on, the shape melts away
        const tV = at("vanishes");
        tl.to(lights, { k: 1, duration: 0.35, ease: "power2.out", onUpdate: setLights }, tV - 0.05);
        tl.to(silD, { attr: { opacity: 0 }, duration: 0.45, ease: "power2.inOut" }, tV - 0.05);
        tl.to(lock, { rotation: 25, opacity: 0, scale: 1.25, duration: 0.45, ease: "power2.in" }, tV + 0.15);
        tl.to(los, { opacity: 0, duration: 0.3 }, tV + 0.15);
        KP.eyeTo(tl, pred.eye, tV + 0.2, { lid: 0, fear: 0.5, lx: 0.95, ly: -0.1 }, 0.2);
        KP.eyeTo(tl, pred.eye, tV + 0.5, { lx: 0.3, ly: -0.9 }, 0.2);
        const q = document.createElement("div");
        q.textContent = "?";
        q.style.cssText = "position:absolute;font:900 150px Nunito,sans-serif;color:#fff1d6;text-shadow:0 8px 0 #0a2a50;opacity:0;";
        S.ui.appendChild(q);
        gsap.set(q, { xPercent: -50, yPercent: -50 });
        S.cam.pin(q, 520, 880);
        tl.fromTo(q, { opacity: 0, scale: 0.3, rotation: -20 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, tV + 0.3);

        // ---------------------------------------------------------------- clock
        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t;
          hb.setAttribute("transform", `translate(${f(Math.sin(t * 1.1) * 8)},${f(Math.sin(t * 1.6) * 10)})`);
          pred.phase = t * 4.5; pred.update();
        };
        // redraw after every tween has rendered: a clock tween would run first on a forward seek and read stale values
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.5, "2,8,24"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
