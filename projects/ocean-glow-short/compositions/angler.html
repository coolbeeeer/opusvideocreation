<template id="angler-template">
  <!-- "An anglerfish dangles a glowing lure. Something curious swims closer. Bad idea."
       Open close on the lure in the dark, pull back to reveal the anglerfish; a small fish falls for the light; snap. -->
  <div data-composition-id="angler" data-width="1080" data-height="1920" data-duration="5.82">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KO = window.OCEAN;
        const ID = "angler", R = document.querySelector('[data-composition-id="angler"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, rnd = K.rng(41);
        const AX = 320, AY = 960, AR = 290, LX = AX + 1.36 * AR, LY = AY - 0.62 * AR;
        const S = KO.scene(R, ID, { bg: ["#07193d", "#040f26", "#020814"], pool: { x: LX, y: LY, rx: 720, ry: 720, color: "#1d7a64", a: 0.45 } });

        KO.snow(S.mid, { n: 120, seed: 42, a: 0.32 });
        const far = KO.sparks(S.far, { n: 22, p: S.p, seed: 43, x0: -200, x1: 1280, y0: -100, y1: 2000, rmin: 8, rmax: 22, k: 0.5 });
        for (let i = 0; i < 6; i++) KP.softDot(S.near, rnd() * 1080, rnd() * 1920, 30 + rnd() * 50, `${S.p}-gl-blue`, 0.12 + rnd() * 0.12);

        // ---------------------------------------------------------------- cast
        const pw = K.g(S.act);                                    // the prey, drawn under the angler so the jaws close over it
        const pwi = K.g(pw, { transform: "scale(-1,1)" });
        const prey = KO.fish(pwi, { L: 200, p: S.p, seed: 5, eyeR: 20 });
        prey.eye.lx = 0.7; prey.eye.ly = 0.1; prey.eye.update();
        gsap.set(pw, { x: 1300, y: LY + 6 });
        const aw = K.g(S.act);
        const ang = KO.angler(aw, { r: AR, p: S.p, seed: 44 });
        gsap.set(aw, { x: AX, y: AY });
        const heart = K.el("path", { d: "M 0 12 C -26 -6 -20 -30 0 -18 C 20 -30 26 -6 0 12 Z", fill: "#ff7fa8", opacity: 0 }, S.act);

        // ---------------------------------------------------------------- reveal: close on the lure, then pull back
        gsap.set(S.cam, { px: LX, py: LY, s: 1.7 }); S.cam.apply();
        K.camTo(tl, S.cam, 0.15, { px: 560, py: 900, s: 1.0 }, at("dangles") + 0.5, "power2.inOut");
        K.camTo(tl, S.cam, at("dangles") + 0.65, { px: 600, py: 880, s: 1.06 }, at("bad") - at("dangles") - 0.9, "sine.inOut");
        const tagA = S.cam.pin(K.tag(S.ui, { text: "Anglerfish", x: 0, y: 0, color: "violet", size: 56 }), AX - 30, AY - 300);
        K.show(tl, tagA, at("anglerfish") + 0.1);
        K.hide(tl, tagA, at("curious") - 0.3);
        const tagL = S.cam.pin(K.tag(S.ui, { text: "Lure", x: 0, y: 0, color: "green", size: 56 }), LX, LY - 70);
        K.show(tl, tagL, at("lure") - 0.05);
        K.hide(tl, tagL, at("curious") - 0.2);

        // ---------------------------------------------------------------- the curious one
        const tIn = at("curious") - 0.2, tStop = at("closer") + 0.1, PX = LX + 120, PY = LY + 6;
        tl.to(pw, { x: PX, duration: tStop - tIn, ease: "power2.out" }, tIn);
        KP.eyeTo(tl, prey.eye, at("swims"), { fear: -0.2 }, 0.3);
        tl.fromTo(heart, { opacity: 0, scale: 0.3, svgOrigin: "0 0", x: PX + 10, y: PY - 95 }, { opacity: 1, scale: 1.2, y: PY - 130, duration: 0.35, ease: "back.out(3)", immediateRender: false }, at("closer") - 0.2);
        tl.to(heart, { opacity: 0, duration: 0.2 }, at("bad") - 0.15);

        // ---------------------------------------------------------------- "Bad idea."
        const tB = at("bad"), j = { v: 0 }, upd = () => { ang.jaw = j.v; ang.update(); };
        KP.eyeTo(tl, ang.eye, tB - 0.35, { lid: 0.35, lx: 0.9, ly: -0.1 }, 0.15);
        tl.to(aw, { x: AX - 24, y: AY + 12, duration: 0.18, ease: "power2.out" }, tB - 0.2);
        tl.to(j, { v: 1, duration: 0.12, ease: "power2.out", onUpdate: upd }, tB - 0.12);
        const LUNGE = [PX - 0.33 * AR, PY - 0.06 * AR];
        tl.to(aw, { x: LUNGE[0], y: LUNGE[1], duration: 0.14, ease: "power3.out" }, tB);
        tl.to(j, { v: 0, duration: 0.08, ease: "power3.in", onUpdate: upd }, tB + 0.1);
        tl.set(pw, { opacity: 0 }, tB + 0.16);
        K.shake(tl, S.cam, tB + 0.16, 28, 7, 0.04);
        tl.to(aw, { x: LUNGE[0] - 140, y: LUNGE[1] + 70, duration: DUR - tB - 0.3, ease: "power2.out" }, tB + 0.3);
        KP.eyeTo(tl, ang.eye, tB + 0.35, { lid: 0.5, lx: 0.3, ly: 0.2 }, 0.25);
        const burp = K.el("circle", { r: 14, fill: "rgba(220,250,255,0.25)", stroke: "#e6fdff", "stroke-width": 3, opacity: 0 }, S.act);
        tl.fromTo(burp, { opacity: 0, attr: { cx: LUNGE[0] + 0.9 * AR, cy: LUNGE[1] - 0.02 * AR } }, { opacity: 0.9, attr: { cy: LUNGE[1] - 0.6 * AR }, duration: 0.6, ease: "power1.out", immediateRender: false }, tB + 0.45);

        // ---------------------------------------------------------------- clock
        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t;
          ang.sway = t * 1.8; ang.phase = t * 2.5; ang.lure.k = 1 + 0.12 * Math.sin(t * 7); ang.update(); ang.lure.update();
          prey.phase = t * 9; prey.update();
          far.list.forEach((s) => { s.glow.k = 0.35 + 0.25 * Math.sin(t * s.sp * 2 + s.ph); s.glow.update(); });
        };
        // redraw after every tween has rendered: a clock tween would run first on a forward seek and read stale values
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.6, "1,4,12"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
