<template id="chemistry-template">
  <!-- "So life makes its own, by mixing a chemical fuel with an enzyme."
       Lights come on all around in a wave; the camera dives into one photophore; inside, an enzyme meets its fuel
       and the reaction gives off light. (The fuel is luciferin, the enzyme luciferase; oxygen is left out for brevity.) -->
  <div data-composition-id="chemistry" data-width="1080" data-height="1920" data-duration="4.6">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KO = window.OCEAN;
        const ID = "chemistry", R = document.querySelector('[data-composition-id="chemistry"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, rnd = K.rng(31);

        // ================================================================ wide: the lights come on
        const A = KO.scene(R, ID, { bg: ["#05204a", "#020a1c"], pool: { x: 540, y: 820, rx: 760, ry: 900, color: "#1f63a8", a: 0.45 } });
        const sp = KO.sparks(A.far, { n: 60, p: A.p, seed: 32, x0: -200, x1: 1280, y0: -100, y1: 2000, rmin: 10, rmax: 32, k: 0 });
        const snow = KO.snow(A.mid, { n: 130, seed: 33, a: 0.4 });
        tl.to(snow, { y: 40, duration: DUR, ease: "none" }, 0);
        const HX = 520, HY = 760;
        const hw = K.g(A.act, { transform: `translate(${HX},${HY})` });
        const hHalo = KO.glow(hw, { r: 520, color: "cyan", p: A.p, core: 0, k: 0 });
        const hero = KO.fish(hw, { L: 440, pal: KO.C.dim, p: A.p, photo: 8, photoR: 0.1, photoK: 0, seed: 3 });
        const cast = [];
        const add = (x, y, make, light) => { const w = K.g(A.act, { transform: `translate(${x},${y})` }); const a = make(w); cast.push({ x, y, a, light }); return a; };
        const jel = add(230, 430, (w) => KO.jelly(w, { r: 105, p: A.p }), (a, k) => { a.flash = k; });
        const ang = add(860, 1110, (w) => KO.angler(w, { r: 110, p: A.p }), (a, k) => { a.lure.k = k; a.lure.update(); });
        const hat = add(860, 420, (w) => KO.hatchet(w, { L: 210, p: A.p }), (a, k) => { a.k = k; a.update(); });
        const smalls = [[200, 1090], [300, 250], [700, 1270]].map(([x, y], i) => add(x, y, (w) => KO.fish(w, { L: 170, pal: KO.C.dim, p: A.p, photo: 6, photoR: 0.12, photoK: 0, seed: 40 + i }), (a, k) => a.light(k)));
        ang.lure.k = 0; ang.lure.update();

        const tSo = at("so");
        const wave = (x, y) => tSo + Math.hypot(x - HX, y - HY) / 900 * 0.7;
        const st = { k: 0 };
        tl.to(st, { k: 1.2, duration: 0.3, ease: "power2.out", onUpdate: () => { hero.light(st.k); hHalo.k = st.k * 0.6; hHalo.update(); } }, tSo - 0.05);
        cast.forEach((c) => {
          const s = { k: 0 };
          tl.to(s, { k: 1, duration: 0.3, ease: "power2.out", onUpdate: () => { c.light(c.a, s.k); if (c.a.update) c.a.update(); } }, wave(c.x, c.y));
        });
        KP.eyeTo(tl, hero.eye, tSo + 0.1, { fear: 0.35, lx: 0.6 }, 0.15);
        KP.eyeTo(tl, hero.eye, tSo + 0.5, { fear: 0 }, 0.3);

        // camera: drift, then dive into the fourth photophore
        const u = 3 / 7, L = 440, Hh = L * 0.46, PX = HX + (0.3 - u * 0.62) * L, PY = HY + (0.34 - Math.abs(u - 0.45) * 0.22) * Hh;
        const tCut = at("by") - 0.08;
        K.camTo(tl, A.cam, 0, { s: 1.05, py: 930 }, tCut - 0.65, "sine.inOut");
        K.camTo(tl, A.cam, tCut - 0.65, { px: PX, py: PY, s: 9 }, 0.65, "power3.in");
        const flash = document.createElement("div");
        flash.style.cssText = "position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#ffffff 0%,#bdfbff 30%,#57e6ff 65%,#1aa6d6 100%);opacity:0;";

        // ================================================================ close-up: fuel meets enzyme
        const B = KO.scene(R, "chemclose", { bg: ["#07395a", "#03203a", "#021428"], pool: { x: 540, y: 820, rx: 700, ry: 800, color: "#1f9fc8", a: 0.45 } });
        B.stage.style.opacity = 0;
        const rb = K.rng(34);
        for (let i = 0; i < 14; i++) KP.softDot(B.far, rb() * 1080, 150 + rb() * 1500, 70 + rb() * 170, `${B.p}-gl-blue`, 0.12 + rb() * 0.14);
        for (let i = 0; i < 10; i++) KP.softDot(B.near, rb() * 1080, rb() * 1920, 40 + rb() * 80, `${B.p}-gl-cyan`, 0.1 + rb() * 0.12);
        KO.snow(B.mid, { n: 70, seed: 35, a: 0.35, color: "#bff6ff" });
        const burst = KO.glow(B.act, { x: 690, y: 800, r: 820, color: "cyan", p: B.p, core: 40, k: 0 });   // behind the enzyme
        const fw = K.g(B.act), ew = K.g(B.act);
        const fuel = KO.fuel(fw, { r: 95, p: B.p });
        const ewi = K.g(ew, { transform: "scale(-1,1)" });           // mouth faces left, toward the fuel
        const enz = KO.enzyme(ewi, { r: 150, p: B.p });
        const enzRim = K.el("circle", { r: 158, fill: "none", stroke: "#bdfbff", "stroke-width": 10, opacity: 0 }, ewi);
        gsap.set(fw, { x: -220, y: 830 });
        gsap.set(ew, { x: 1320, y: 800 });
        tl.set(B.stage, { opacity: 1 }, tCut);
        tl.set(A.stage, { opacity: 0 }, tCut);
        tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.in", immediateRender: false }, tCut - 0.14);
        tl.to(flash, { opacity: 0, duration: 0.3, ease: "power2.out" }, tCut + 0.02);
        tl.to(fw, { x: 320, duration: 0.6, ease: "power2.out" }, tCut + 0.05);
        tl.to(ew, { x: 770, duration: 0.6, ease: "power2.out" }, tCut + 0.1);
        K.camTo(tl, B.cam, tCut, { s: 1.06, py: 900 }, DUR - tCut, "sine.inOut");
        const tagF = B.cam.pin(K.tag(B.ui, { text: "Fuel", x: 0, y: 0, color: "amber", size: 54 }), 320, 690);
        K.show(tl, tagF, at("fuel") - 0.05);
        const tagE = B.cam.pin(K.tag(B.ui, { text: "Enzyme", x: 0, y: 0, color: "violet", size: 50 }), 750, 610);
        K.show(tl, tagE, at("enzyme") - 0.08);
        KP.eyeTo(tl, fuel.eyes, at("with") - 0.1, { lx: 0.9, ly: 0 }, 0.2);
        KP.eyeTo(tl, enz.eyes, at("with"), { lx: 0.9, ly: 0.2 }, 0.2);
        const tMeet = at("enzyme") + 0.06;
        tl.to(fw, { x: 600, y: 815, duration: tMeet - at("with") - 0.05, ease: "power2.in" }, at("with") + 0.05);
        tl.to(ew, { x: 700, duration: tMeet - at("with") - 0.05, ease: "power1.inOut" }, at("with") + 0.05);
        const mo = { v: 1 };
        tl.to(mo, { v: 0.05, duration: 0.1, ease: "power3.in", onUpdate: () => { enz.open = mo.v; enz.update(); } }, tMeet);
        tl.set(fw, { opacity: 0 }, tMeet + 0.08);
        K.hide(tl, tagF, tMeet);
        tl.to(burst, { k: 1.6, duration: 0.16, ease: "power3.out", onUpdate: burst.update }, tMeet + 0.06);
        tl.to(burst, { k: 1.05, duration: 0.5, ease: "power2.inOut", onUpdate: burst.update }, tMeet + 0.24);
        tl.fromTo(enzRim, { opacity: 0 }, { opacity: 0.9, duration: 0.15, immediateRender: false }, tMeet + 0.06);
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * Math.PI * 2 + rb(), d = 260 + rb() * 360;
          const s = K.el("polygon", { points: K.star(0, 0, 4, 16 + rb() * 14, 5, 0), fill: "#e9feff", opacity: 0 }, B.act);
          gsap.set(s, { x: 640, y: 810, svgOrigin: "0 0" });
          tl.set(s, { opacity: 1 }, tMeet + 0.08);
          tl.to(s, { x: 640 + Math.cos(a) * d, y: 810 + Math.sin(a) * d, rotation: 180, duration: 0.6, ease: "power2.out" }, tMeet + 0.08);
          tl.to(s, { opacity: 0, duration: 0.25 }, tMeet + 0.45);
        }
        KP.eyeTo(tl, enz.eyes, tMeet + 0.12, { lid: 0.5, lx: 0.2, ly: -0.3 }, 0.2);
        const tagL = B.cam.pin(K.tag(B.ui, { text: "Light!", x: 0, y: 0, color: "teal", size: 60, pointer: false }), 640, 470);
        K.show(tl, tagL, tMeet + 0.2);

        // ================================================================ clocks
        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t;
          hero.phase = t * 5; hero.update();
          jel.phase = t * 2; jel.pulse = 0.5 + 0.5 * Math.sin(t * 3); jel.spin = t * 2; jel.update();
          ang.sway = t * 2; ang.phase = t * 3; ang.update();
          smalls.forEach((a, i) => { a.phase = t * 6 + i; a.update(); });
          sp.list.forEach((s, i) => { const on = Math.min(1, Math.max(0, (t - wave(s.x, s.y)) / 0.3)); s.glow.k = on * (0.5 + 0.4 * Math.sin(t * s.sp * 2 + s.ph)); s.glow.update(); });
          fw.firstChild && fw.firstChild.setAttribute("transform", `translate(0,${f(Math.sin(t * 3) * 10)}) rotate(${f(Math.sin(t * 2) * 6)})`);
          if (t < tMeet) { enz.open = 0.75 + 0.25 * Math.sin(t * 9); enz.update(); }
        };
        // redraw after every tween has rendered: a clock tween would run first on a forward seek and read stale values
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        A.stage.insertBefore(KP.vignette(A.stage, 0.6, "2,6,20"), A.ui);
        B.stage.insertBefore(KP.vignette(B.stage, 0.45, "2,14,28"), B.ui);
        R.appendChild(flash);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
