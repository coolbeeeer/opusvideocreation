<template id="viruses-template">
  <div data-composition-id="viruses" data-width="1920" data-height="1080" data-duration="6.106">
    <style>
      [data-composition-id="viruses"] .stage { position: absolute; inset: 0; overflow: hidden; background: #120f2e; }
      [data-composition-id="viruses"] svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      [data-composition-id="viruses"] .ui { position: absolute; inset: 0; }
    </style>
    <div class="stage">
      <svg viewBox="0 0 1920 1080">
        <defs>
          <radialGradient id="vir-bg" cx="0.5" cy="0.5" r="0.8"><stop offset="0" stop-color="#1e2350" /><stop offset="1" stop-color="#0c0b24" /></radialGradient>
        </defs>
        <g class="cam">
          <rect x="-1000" y="-800" width="3920" height="2680" fill="url(#vir-bg)" />
          <g class="specks" fill="#a8a0e0"></g>
          <g class="bact"></g>
          <g class="pops"></g>
          <g class="vir"></g>
          <g class="drugs"></g>
        </g>
      </svg>
      <div class="ui"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT;
        const R = document.querySelector('[data-composition-id="viruses"]');
        const $ = (s) => R.querySelector(s);
        const ui = $(".ui");
        const T0 = K.scene("viruses").start, DUR = K.scene("viruses").dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const rnd = K.rng(606);
        const tl = gsap.timeline({ paused: true });
        for (let i = 0; i < 70; i++) K.el("circle", { cx: K.f(-300 + rnd() * 2500), cy: K.f(-200 + rnd() * 1500), r: K.f(1.5 + rnd() * 3.5), opacity: K.f(0.1 + rnd() * 0.25) }, $(".specks"));
        const cam = K.camera($(".cam"), 960, 540, 1.0);
        K.camTo(tl, cam, 0, { px: 1000, s: 1.04 }, DUR, "sine.inOut");

        // ------------------------------------------------ "But antibiotics only work on bacteria."
        const B = [[420, 420], [600, 640], [330, 760]].map(([x, y], i) => {
          const b = K.bacterium($(".bact"), { L: 170, r: 38, seed: 60 + i, flagSide: i % 2 ? 1 : -1 });
          gsap.set(b.g, { svgOrigin: "0 0", x, y, rotation: [-20, 15, 35][i], scale: 0 });
          tl.fromTo(b.g, { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, i * 0.05);
          return { b, x, y };
        });
        const ph = { p: 0 };
        tl.fromTo(ph, { p: 0 }, { p: 30, duration: DUR, ease: "none", immediateRender: false, onUpdate: () => B.forEach((o, i) => { o.b.phase = ph.p + i; o.b.update(); }) }, 0);
        const tagB = K.tag(ui, { text: "Bacteria", x: 470, y: 270, color: "green", size: 48 });
        K.show(tl, tagB, 0.3);
        const tBa = at("bacteria");
        const drugs = $(".drugs");
        B.forEach((o, i) => {
          const m = K.mol(drugs, "pen", 0.6), t = tBa - 0.55 + i * 0.12;
          gsap.set(m, { svgOrigin: "0 0", x: o.x - 420, y: o.y - 260, rotation: rnd() * 360, opacity: 0 });
          tl.set(m, { opacity: 1 }, t);
          tl.to(m, { x: o.x, y: o.y, rotation: "+=120", duration: 0.5, ease: "power2.in" }, t);
          tl.set(m, { opacity: 0 }, t + 0.5);
          tl.to(o.b.g, { scale: 1.25, duration: 0.08, ease: "power2.out" }, t + 0.5);
          tl.set(o.b.g, { opacity: 0 }, t + 0.58);
          const star = K.el("polygon", { points: K.star(o.x, o.y, 10, 90, 40, 0.2), fill: "#fff3c0", opacity: 0 }, $(".pops"));
          tl.fromTo(star, { opacity: 1, scale: 0.3, svgOrigin: `${o.x} ${o.y}` }, { scale: 1.1, duration: 0.12, ease: "power3.out", immediateRender: false }, t + 0.56);
          tl.to(star, { opacity: 0, duration: 0.18 }, t + 0.68);
          for (let k = 0; k < 7; k++) {
            const a = (k / 7) * Math.PI * 2, f = K.el("circle", { cx: o.x, cy: o.y, r: K.f(8 + rnd() * 8), fill: k % 2 ? "#8aa446" : "#56702c", opacity: 0 }, $(".pops"));
            tl.set(f, { opacity: 1 }, t + 0.56);
            tl.to(f, { attr: { cx: o.x + Math.cos(a) * 150, cy: o.y + Math.sin(a) * 120 }, duration: 0.5, ease: "power2.out" }, t + 0.56);
            tl.to(f, { opacity: 0, duration: 0.2 }, t + 0.86);
          }
        });
        K.hide(tl, tagB, tBa + 0.35);

        // ------------------------------------------------ "Against viruses, like colds or flu,"
        const tV = at("viruses");
        const V = [[1260, 440, 92], [1560, 640, 78], [1180, 760, 64], [1660, 330, 56]].map(([x, y, r], i) => {
          const g = K.g($(".vir"));
          const v = K.virus(g, r, 70 + i);
          gsap.set(g, { svgOrigin: "0 0", x: x + 300, y, scale: 0, rotation: rnd() * 40 });
          tl.to(g, { x, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, tV - 0.25 + i * 0.1);
          tl.to(g, { rotation: "+=25", y: y + (i % 2 ? 14 : -14), duration: DUR - tV, ease: "sine.inOut" }, tV + 0.3);
          return { g, x, y, r };
        });
        const ban = K.callout(ui, { text: "Viruses", x: 1400, y: 150, color: "violet", size: 64 });
        K.show(tl, ban, tV - 0.05);
        const tagCold = K.tag(ui, { text: "Colds", x: 1180, y: 660, color: "violet", size: 44 });
        const tagFlu = K.tag(ui, { text: "Flu", x: 1560, y: 530, color: "violet", size: 44 });
        K.show(tl, tagCold, at("colds") - 0.05);
        K.show(tl, tagFlu, at("flu") - 0.05);

        // ------------------------------------------------ "they do nothing."
        const tN = at("nothing");
        V.slice(0, 3).forEach((v, i) => {
          const m = K.mol(drugs, "pen", 0.6), t = tN - 0.65 + i * 0.12;
          const sx = v.x - 520, sy = v.y - 160 + i * 60;
          gsap.set(m, { svgOrigin: "0 0", x: sx, y: sy, rotation: rnd() * 360, opacity: 0 });
          tl.set(m, { opacity: 1 }, t);
          tl.to(m, { x: v.x - v.r * 1.35, y: v.y - 10, rotation: "+=140", duration: 0.42, ease: "power2.in" }, t);
          tl.to(m, { x: sx + 80, y: sy - 220, rotation: "+=-260", duration: 0.7, ease: "power2.out" }, t + 0.42);
          tl.to(m, { opacity: 0, duration: 0.2 }, t + 1.0);
          tl.to(v.g, { scaleX: 0.9, scaleY: 1.08, duration: 0.07, yoyo: true, repeat: 1 }, t + 0.42);
        });
        const tagNo = K.tag(ui, { text: "No effect", x: 1400, y: 940, color: "crimson", size: 52, pointer: false });
        K.show(tl, tagNo, tN - 0.1);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines["viruses"] = tl;
      })();
    </script>
  </div>
</template>
