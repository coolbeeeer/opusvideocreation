<template id="compare-template">
  <div data-composition-id="compare" data-width="1920" data-height="1080" data-duration="3.412">
    <style>
      [data-composition-id="compare"] .stage { position: absolute; inset: 0; overflow: hidden; background: #0a2232; }
      [data-composition-id="compare"] svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      [data-composition-id="compare"] .ui { position: absolute; inset: 0; }
    </style>
    <div class="stage">
      <svg viewBox="0 0 1920 1080">
        <defs>
          <radialGradient id="cmp-bg" cx="0.5" cy="0.45" r="0.8"><stop offset="0" stop-color="#123a4c" /><stop offset="1" stop-color="#071926" /></radialGradient>
        </defs>
        <g class="cam">
          <rect x="-800" y="-600" width="3520" height="2280" fill="url(#cmp-bg)" />
          <g class="specks" fill="#7fb8c8"></g>
          <g class="cell"></g>
          <g class="bact"></g>
          <path class="glint" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0" />
        </g>
      </svg>
      <div class="ui"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT;
        const R = document.querySelector('[data-composition-id="compare"]');
        const $ = (s) => R.querySelector(s);
        const ui = $(".ui");
        const T0 = K.scene("compare").start, DUR = K.scene("compare").dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const rnd = K.rng(303);
        const tl = gsap.timeline({ paused: true });

        const sp = $(".specks");
        for (let i = 0; i < 60; i++) K.el("circle", { cx: K.f(-200 + rnd() * 2300), cy: K.f(-100 + rnd() * 1300), r: K.f(1.5 + rnd() * 4), opacity: K.f(0.08 + rnd() * 0.2) }, sp);
        tl.to(sp, { x: -60, duration: DUR, ease: "none" }, 0);

        const cell = K.humanCell($(".cell"), 275, 11);
        gsap.set(cell.g, { svgOrigin: "0 0", x: 590, y: 560 });
        const bact = K.bacterium($(".bact"), { L: 260, r: 58, seed: 21, flagSide: 1 });
        gsap.set(bact.g, { svgOrigin: "0 0", x: 1380, y: 560 });
        const ph = { p: 0 };
        tl.fromTo(ph, { p: 0 }, { p: 9, duration: DUR, ease: "none", immediateRender: false, onUpdate: () => { cell.phase = ph.p; cell.update(); bact.phase = ph.p * 3; bact.update(); } }, 0);

        // both slide in from the sides
        tl.fromTo(cell.g, { x: 360, opacity: 0 }, { x: 590, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo(bact.g, { x: 1640, opacity: 0 }, { x: 1380, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.05);
        gsap.set([cell.g, bact.g], { opacity: 0 });

        const tagB = K.tag(ui, { text: "Bacterium", x: 1380, y: 440, color: "green", size: 46 });
        const tagC = K.tag(ui, { text: "Your cell", x: 590, y: 245, color: "crimson", size: 46 });
        K.show(tl, tagB, at("bacteria") - 0.05);
        K.show(tl, tagC, at("differently"));

        // "built differently": the bacterium's stiff wall catches a glint
        const glint = $(".glint");
        glint.setAttribute("d", `M ${1380 - 100} ${560 - 58} L ${1380 + 100} ${560 - 58}`);
        const tD = at("differently");
        tl.set(glint, { opacity: 0.9, strokeDasharray: "60 400", strokeDashoffset: 60 }, tD);
        tl.to(glint, { strokeDashoffset: -260, duration: 0.35, ease: "power1.inOut" }, tD);
        tl.to(glint, { opacity: 0, duration: 0.1 }, tD + 0.3);

        // camera drifts, then dives toward the bacterium's wall to lead into the next scene
        const cam = K.camera($(".cam"), 960, 540, 1.0);
        K.camTo(tl, cam, 0, { px: 990, s: 1.03 }, DUR - 0.5, "sine.inOut");
        K.hide(tl, tagB, DUR - 0.42);
        K.hide(tl, tagC, DUR - 0.42);
        K.camTo(tl, cam, DUR - 0.42, { px: 1380, py: 560, s: 3.4 }, 0.42, "power3.in");

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines["compare"] = tl;
      })();
    </script>
  </div>
</template>
