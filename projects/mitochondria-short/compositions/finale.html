<template id="finale-template">
  <!-- "So every step you take runs on a deal made about two billion years ago."
       The dive in reverse: from the mitochondria inside the fibre back out through the bundle and the leg to the person,
       who is walking again, now at sunset. Small orange lights flicker in the legs with each step. Title. -->
  <div data-composition-id="finale" data-width="1080" data-height="1920" data-duration="7.515">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KH = window.HUMAN, KC = window.CELL, KO = window.OCEAN, WORLD = window.WORLD;
        const ID = "finale", R = document.querySelector('[data-composition-id="finale"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, sm = (x) => x * x * (3 - 2 * x), clamp = (x) => Math.max(0, Math.min(1, x));
        const S = WORLD.build(R, "fin", { palette: "sunset", x0: 470 });
        const W = S.zc, M = W.M, L3 = Math.log(M[3]);

        // walking: barely moving while we are inside, back to full pace once the person is in view
        const tOut = at("take") + 0.05;
        const phase = KH.phaseTable([[0, 0.08], [tOut - 0.8, 0.12], [tOut + 0.2, 1], [DUR, 1]], DUR + 1);   // same keys in audio/js_events.cjs
        const tT = at("ago") + 0.25;
        const ZK = [[0, L3 + 0.25], [tOut, Math.log(1.0)], [tT - 1.0, Math.log(0.96)], [tT + 0.5, Math.log(0.74)], [DUR, Math.log(0.72)]];
        const zoomAt = (t) => {
          if (t <= ZK[0][0]) return ZK[0][1];
          for (let i = 0; i < ZK.length - 1; i++) if (t <= ZK[i + 1][0]) { const u = clamp((t - ZK[i][0]) / (ZK[i + 1][0] - ZK[i][0])); const e = i === 0 ? 1 - (1 - u) ** 2.2 : sm(u); return ZK[i][1] + (ZK[i + 1][1] - ZK[i][1]) * e; }
          return ZK[ZK.length - 1][1];
        };

        // little orange lights in the legs: the mitochondria at work, flickering with each step
        const glowG = K.g(W.C[0]);
        const sparks = Array.from({ length: 16 }, (_, i) => ({ halo: K.el("circle", { r: 20, fill: "#ffb24d", opacity: 0 }, glowG), el: K.el("circle", { r: 8, fill: "#ffe2a8", opacity: 0 }, glowG), leg: i % 2, u: 0.15 + ((i * 0.37) % 0.8), side: ((i * 7) % 5 - 2) * 4, seg: i % 3 ? "thigh" : "shin" }));

        // title (above the walker once the camera has pulled back)
        const card = document.createElement("div");
        card.style.cssText = "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;pointer-events:none;";
        card.innerHTML =
          `<div style="position:absolute;left:50%;top:490px;width:1060px;height:480px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center, rgba(40,20,50,0.55) 0%, rgba(40,20,50,0.35) 45%, rgba(40,20,50,0) 72%);"></div>` +
          `<div class="sub" style="position:absolute;left:50%;top:375px;transform:translate(-50%,-50%);white-space:nowrap;font:800 44px Nunito,sans-serif;color:#ffe7b0;text-shadow:0 0 18px rgba(255,170,80,0.6)">the bacteria that moved into</div>` +
          `<div class="big" style="position:absolute;left:50%;top:492px;transform:translate(-50%,-50%);white-space:nowrap;font:700 184px/1 'Yanone Kaffeesatz',sans-serif;color:#fff1d6;letter-spacing:0.03em;text-shadow:0 0 30px rgba(255,144,0,0.85),0 0 80px rgba(255,120,40,0.55)">YOUR CELLS</div>` +
          `<div class="bar" style="position:absolute;left:50%;top:600px;width:460px;height:12px;border-radius:6px;transform:translate(-50%,-50%);background:linear-gradient(90deg,#ff9000,#b46ad8 50%,#2fb3b8)"></div>`;
        S.ui.appendChild(card);
        const sub = card.querySelector(".sub"), big = card.querySelector(".big"), bar = card.querySelector(".bar");
        tl.set(card, { opacity: 1 }, tT);
        tl.fromTo(card.firstChild, { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, tT);
        tl.fromTo(big, { opacity: 0, filter: "blur(16px)", scale: 1.1 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power2.out", immediateRender: false }, tT);
        tl.fromTo(sub, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, immediateRender: false }, tT + 0.3);
        tl.fromTo(bar, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, tT + 0.45);
        gsap.set([sub, big, bar], { opacity: 0 });
        const tag = K.tag(S.ui, { text: "~2 billion years", x: 0, y: 0, color: "violet", size: 46 });
        K.show(tl, tag, at("billion") - 0.15);
        K.hide(tl, tag, tT - 0.1);

        const st = { lens: 1, sparks: 0 };
        tl.to(st, { lens: 0, duration: 0.3, ease: "power2.in" }, tOut - 0.15);
        tl.to(st, { sparks: 1, duration: 0.4 }, at("deal") - 0.1);
        tl.to(st, { sparks: 0, duration: 0.4 }, tT);

        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t, ph = phase(t);
          S.walker.at(ph);
          S.shadow.setAttribute("cx", f(S.walker.x(ph) + 24));
          W.lens[1] = st.lens;
          const logZ = zoomAt(t), Z = Math.exp(logZ);
          const F = S.focus(logZ, [S.followX(ph), 960 - 70 * sm(clamp((t - (tT - 1.0)) / 1.5))]);
          S.camera(Z, F);
          S.L3.mitos.forEach((q, i) => { q.m.phase = t * 2.2 + i * 0.7; q.m.update(); if (q.m.eyes) { q.m.eyes.lid = 0; q.m.eyes.update(); } });
          const P = S.walker.h.pose, x0 = S.walker.x(ph), y0 = S.GROUND + 40;
          sparks.forEach((s, i) => {
            const L = P.legs[s.leg], a = s.seg === "thigh" ? L.hip : L.knee, b = s.seg === "thigh" ? L.knee : L.ankle;
            const x = x0 + a[0] + (b[0] - a[0]) * s.u + s.side, y = y0 - (a[1] + (b[1] - a[1]) * s.u);
            s.el.setAttribute("cx", f(x)); s.el.setAttribute("cy", f(y)); s.halo.setAttribute("cx", f(x)); s.halo.setAttribute("cy", f(y));
            const flick = 0.5 + 0.5 * Math.sin(ph * Math.PI * 4 + i * 1.7);
            s.el.setAttribute("opacity", f(st.sparks * (0.45 + 0.55 * flick)));
            s.el.setAttribute("r", f(7 + 5 * flick));
            s.halo.setAttribute("opacity", f(st.sparks * 0.35 * (0.5 + 0.5 * flick)));
            s.halo.setAttribute("r", f(16 + 10 * flick));
          });
          const hd = [540 + (x0 + 40 - F[0]) * Z, 960 + (y0 - 715 - F[1]) * Z];
          tag.style.left = f(hd[0]) + "px"; tag.style.top = f(hd[1]) + "px";
          S.birds.setAttribute("transform", `translate(${f(t * 40)},${f(Math.sin(t * 2) * 6)})`);
        };
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.35, "40,20,50"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
