<template id="walk-template">
  <!-- Lines 1-2. "Every step you take is powered by bacteria. Well, former bacteria."
       "Dive into your leg, into a muscle cell, and there they are: thousands of mitochondria."
       Wide shot of a person walking through a park (camera tracks them, parallax behind and in front). An inset shows
       bacteria that turn into mitochondria. Then one continuous dive: walking slows down, a lens opens on the thigh,
       and the zoom chain goes thigh cross-section -> muscle bundle -> inside one muscle fibre. It ends pushing onto
       one mitochondrion, which the next scene replaces with its bacterial ancestor (match cut under a closing vignette). -->
  <div data-composition-id="walk" data-width="1080" data-height="1920" data-duration="11.145">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KH = window.HUMAN, KC = window.CELL, WORLD = window.WORLD;
        const ID = "walk", R = document.querySelector('[data-composition-id="walk"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, sm = (x) => x * x * (3 - 2 * x), clamp = (x) => Math.max(0, Math.min(1, x));
        const S = WORLD.build(R, "wlk", { palette: "day", x0: 470 });
        const W = S.zc, M = W.M;

        // ---------------------------------------------------------------- the walk: normal pace, then almost frozen for the dive
        const tDive = at("dive");
        const phase = KH.phaseTable([[0, 1], [tDive - 0.3, 1], [tDive + 0.6, 0.1], [DUR, 0.08]], DUR + 1);   // same keys in audio/js_events.cjs
        const strikes = phase.strikes(0, tDive + 0.4);

        // ---------------------------------------------------------------- zoom: keyed in log space, eased per segment
        const L1 = Math.log(M[1]), L3 = Math.log(M[3]);
        const ZK = [[0, 0], [tDive - 0.15, Math.log(1.08)], [at("leg") + 0.35, L1 + 0.05], [at("into", 2) + 0.05, L1 + 0.22],
                    [at("cell") + 0.42, L3], [DUR - 0.95, L3 + 0.16], [DUR, L3 + 0.95]];
        const zoomAt = (t) => {
          if (t <= ZK[0][0]) return ZK[0][1];
          for (let i = 0; i < ZK.length - 1; i++) if (t <= ZK[i + 1][0]) { const u = sm(clamp((t - ZK[i][0]) / (ZK[i + 1][0] - ZK[i][0]))); return ZK[i][1] + (ZK[i + 1][1] - ZK[i][1]) * u; }
          return ZK[ZK.length - 1][1];
        };
        // the mitochondrion the camera ends on: the biggest-eyed one nearest the middle of the fibre
        const hero = S.L3.mitos.filter((q) => q.big).reduce((b, q) => (Math.hypot(q.x, q.y - 80) < Math.hypot(b.x, b.y - 80) ? q : b));

        // ---------------------------------------------------------------- tweened states (read by frame(), which runs after all tweens)
        const st = { lens: 0, vig: 0, insetIn: 0, morph: 0, wake: 0 };
        tl.to(st, { lens: 1, duration: 0.38, ease: "back.out(1.7)" }, tDive - 0.1);
        tl.to(st, { insetIn: 1, duration: 0.3, ease: "back.out(2)" }, at("bacteria") - 0.08);
        tl.to(st, { morph: 1, duration: 0.35, ease: "power2.inOut" }, at("former") - 0.05);
        tl.to(st, { insetIn: 0, duration: 0.25, ease: "power2.in" }, tDive - 0.45);
        tl.to(st, { wake: 1, duration: 0.3, ease: "power2.out" }, at("there") - 0.05);
        tl.to(st, { vig: 1, duration: 0.6, ease: "power2.in" }, DUR - 0.6);

        // ---------------------------------------------------------------- labels (HTML, placed from world points every frame)
        const pinned = [];
        const pin = (el, where) => { pinned.push({ el, where }); return el; };
        const tagYou = pin(K.tag(S.ui, { text: "You", x: 0, y: 0, color: "teal", size: 56 }), () => S.walker.x(phase(clk.t)) + 40 + "," + (S.GROUND + 40 - 715));
        K.show(tl, tagYou, at("you") - 0.05);
        K.hide(tl, tagYou, at("bacteria") - 0.2);
        const tagMus = pin(K.tag(S.ui, { text: "Muscle", x: 0, y: 0, color: "crimson", size: 56 }), () => { const q = W.point(1, [S.lensL2[0], S.lensL2[1] - S.lensL2[2]]); return q[0] + "," + q[1]; });
        K.show(tl, tagMus, at("leg") + 0.12);
        K.hide(tl, tagMus, at("into", 2) + 0.15);
        const tagCells = pin(K.tag(S.ui, { text: "Muscle cells", x: 0, y: 0, color: "crimson", size: 52 }), () => { const q = W.point(2, [S.lensL3[0], S.lensL3[1] - S.lensL3[2]]); return q[0] + "," + q[1]; });
        K.show(tl, tagCells, at("muscle") - 0.12);
        K.hide(tl, tagCells, at("cell") + 0.3);
        const ban = K.callout(S.ui, { text: "Mitochondria", x: 520, y: 380, color: "crimson", size: 74 });
        K.show(tl, ban, at("mitochondria") - 0.08);
        K.hide(tl, ban, DUR - 0.45);

        // ---------------------------------------------------------------- the inset: bacteria that turn into mitochondria
        const inset = document.createElement("div");
        inset.style.cssText = "position:absolute;width:300px;height:300px;border-radius:150px;overflow:hidden;background:#2b1530;box-shadow:0 0 0 12px #ffffff, 0 18px 40px rgba(0,0,0,0.25);opacity:0;";
        S.ui.appendChild(inset);
        const isvg = K.el("svg", { viewBox: "-150 -150 300 300", width: 300, height: 300, style: "position:absolute;inset:0" });
        inset.appendChild(isvg);
        const bugs = [K.g(isvg, { transform: "translate(-40,-55) rotate(-12)" }), K.g(isvg, { transform: "translate(35,55) rotate(10)" })].map((g, i) => ({ g, b: KC.guest(g, { L: 120, r: 30, prefix: "wlki", seed: 3, flagSide: i ? -1 : 1 }) }));   // tails point inward, inside the bubble
        const mitosI = [K.g(isvg, { transform: "translate(-40,-55) rotate(-12)" }), K.g(isvg, { transform: "translate(35,55) rotate(10)" })].map((g) => ({ g, m: KC.mito(g, { L: 130, r: 36, prefix: "wlki", seed: 5 }) }));
        const puffs = K.g(isvg);
        const puffEls = Array.from({ length: 10 }, (_, i) => K.el("circle", { r: 0, fill: "#ffffff", opacity: 0 }, puffs));
        const tail = document.createElement("div");      // little pointer from the bubble to the person
        tail.style.cssText = "position:absolute;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:44px solid #ffffff;opacity:0;";
        S.ui.appendChild(tail);

        // ---------------------------------------------------------------- dust puffs at each footstep in the wide shot
        const dust = K.g(W.C[0]);
        const dustEls = Array.from({ length: 6 }, () => K.el("circle", { r: 0, fill: "#f6e6c4", opacity: 0 }, dust));
        const strikeX = strikes.map((s) => { const ph = phase(s.t), P = KH.walkPose(ph); return S.walker.x(ph) + P.legs[s.foot].ankle[0] - 10; });

        // ---------------------------------------------------------------- vignette that closes on the hero mitochondrion (and opens in the next scene)
        const vig = document.createElement("div");
        vig.style.cssText = "position:absolute;inset:0;pointer-events:none;";
        S.stage.appendChild(vig);

        // ---------------------------------------------------------------- one redraw per frame, after every tween
        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t, ph = phase(t);
          S.walker.at(ph);
          S.shadow.setAttribute("cx", f(S.walker.x(ph) + 24));
          W.lens[1] = st.lens;
          const logZ = zoomAt(t), Z = Math.exp(logZ);
          let F = S.focus(logZ, [S.followX(ph), 960]);
          const uh = sm(clamp((t - (DUR - 0.95)) / 0.95)), Hp = W.point(3, [hero.x, hero.y]);
          F = [F[0] + (Hp[0] - F[0]) * uh, F[1] + (Hp[1] - F[1]) * uh];
          S.camera(Z, F);
          const scr = (p) => [540 + (p[0] - F[0]) * Z, 960 + (p[1] - F[1]) * Z];
          // pinned tags follow their world point but never leave the apps' safe area (they stop at its edge, then hide)
          pinned.forEach(({ el, where }) => { const [x, y] = where().split(",").map(Number), s = scr([x, y]); el.style.left = f(Math.max(300, Math.min(700, s[0]))) + "px"; el.style.top = f(Math.max(400, Math.min(1150, s[1]))) + "px"; });
          // inset bubble above the person, upper right of the head
          const head = scr([S.walker.x(ph) + 20, S.GROUND + 40 - 640]);
          inset.style.left = f(head[0] + 70) + "px"; inset.style.top = f(head[1] - 330) + "px";
          inset.style.opacity = f(clamp(st.insetIn));
          inset.style.transform = `scale(${f(0.4 + 0.6 * st.insetIn)})`;
          tail.style.left = f(head[0] + 120) + "px"; tail.style.top = f(head[1] - 38) + "px"; tail.style.opacity = f(clamp(st.insetIn));
          bugs.forEach((B, i) => { B.b.phase = t * 9 + i; B.b.update(); B.g.setAttribute("opacity", f(1 - sm(clamp(st.morph * 2)))); });
          mitosI.forEach((Mi, i) => { Mi.m.phase = t * 2 + i; Mi.m.update(); Mi.g.setAttribute("opacity", f(sm(clamp(st.morph * 2 - 0.8)))); });
          const pu = clamp(st.morph * 1.6);
          puffEls.forEach((c, i) => {
            const a = (i / 10) * 6.28, d = 20 + 90 * pu;
            c.setAttribute("cx", f(Math.cos(a) * d * 0.9)); c.setAttribute("cy", f(Math.sin(a) * d));
            c.setAttribute("r", f(26 * Math.sin(Math.PI * pu))); c.setAttribute("opacity", f(0.9 * Math.sin(Math.PI * pu)));
          });
          // footstep dust
          let k = 0;
          strikes.forEach((s, i) => {
            const age = t - s.t;
            if (age < 0 || age > 0.45 || k >= dustEls.length - 1) return;
            const u = age / 0.45;
            [-1, 1].forEach((side) => {
              const c = dustEls[k++];
              c.setAttribute("cx", f(strikeX[i] + side * (14 + 46 * u))); c.setAttribute("cy", f(S.GROUND + 34 - 16 * u));
              c.setAttribute("r", f(6 + 12 * u)); c.setAttribute("opacity", f(0.75 * (1 - u)));
            });
          });
          for (; k < dustEls.length; k++) dustEls[k].setAttribute("opacity", 0);
          // mitochondria: wobble; the ones with eyes wake up on "there they are"; a ripple of pulses on "thousands"
          const tTh = at("thousands");
          S.L3.mitos.forEach((q, i) => {
            q.m.phase = t * 2.2 + i * 0.7; q.m.update();
            if (q.m.eyes) { q.m.eyes.lid = 1 - st.wake; q.m.eyes.lx = -0.15 + 0.3 * Math.sin(t * 0.9 + i); q.m.eyes.update(); }
            const d = Math.hypot(q.x, q.y) / 1400, pu2 = clamp((t - tTh - d * 0.5) / 0.3);
            q.wrap.setAttribute("transform", `translate(${f(q.x)},${f(q.y)}) rotate(${f(q.rot)}) scale(${f(1 + 0.12 * Math.sin(Math.PI * pu2))})`);
          });
          S.birds.setAttribute("transform", `translate(${f(t * 40)},${f(Math.sin(t * 2) * 6)})`);
          const v = st.vig;
          vig.style.background = v <= 0 ? "none" : `radial-gradient(ellipse ${f(560 - 260 * v)}px ${f(760 - 300 * v)}px at 50% 50%, rgba(12,6,20,0) 0%, rgba(12,6,20,0) 62%, rgba(12,6,20,${f(0.97 * v)}) 100%)`;
        };
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.28, "20,40,50"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
