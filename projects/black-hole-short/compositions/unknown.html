<template id="unknown-template">
  <!-- Line 7. "What happens there? Nobody knows. Our laws of physics break down."
       The camera dives toward the centre ("Singularity"); a big question mark; then three famous equations orbit the
       point, glitch, crack in half and fall apart. -->
  <div data-composition-id="unknown" data-width="1080" data-height="1920" data-duration="4.765">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KO = window.OCEAN, KS = window.SPACE;
        const ID = "unknown", R = document.querySelector('[data-composition-id="unknown"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, sm = (x) => x * x * (3 - 2 * x), clamp = (x) => Math.max(0, Math.min(1, x)), rn = K.rng(61);
        const S = KS.stage(R, "un", { seed: 61, bg: ["#1a1040", "#0d0826", "#05030f"], nebula: false, stars: 0.7 });
        const CX = 540, CY = 840;

        // ---------------------------------------------------------------- the centre: a point of light with ripples running out of it
        const ripples = Array.from({ length: 4 }, () => K.el("circle", { cx: CX, cy: CY, r: 0, fill: "none", stroke: "#cfd6ff", "stroke-width": 4, opacity: 0 }, S.act));
        KO.glow(S.far, { x: CX, y: CY, r: 1000, color: "blue", p: S.p, core: 0, k: 0.3 });
        const centre = KO.glow(S.act, { x: CX, y: CY, r: 260, color: "white", p: S.p, core: 12, k: 0.9 });
        const streaks = K.g(S.mid);
        const sl = Array.from({ length: 64 }, (_, i) => {
          const a = rn() * Math.PI * 2, d0 = 700 + rn() * 700;
          return { el: K.el("line", { stroke: i % 3 ? "#cfd6ff" : "#ffd9a6", "stroke-width": f(2 + rn() * 3), "stroke-linecap": "round", opacity: 0 }, streaks), a, d0, sp: 0.4 + rn() * 0.5, ph: rn() };
        });

        // ---------------------------------------------------------------- "?" and the equations (HTML text; Latin characters only, see docs/09-pitfalls.md)
        const qm = document.createElement("div");
        qm.style.cssText = `position:absolute;left:${CX}px;top:${CY - 10}px;transform:translate(-50%,-50%);font:700 360px/1 'Yanone Kaffeesatz',sans-serif;color:#ffffff;text-shadow:0 0 40px rgba(180,190,255,0.8);opacity:0;`;
        qm.textContent = "?";
        S.ui.appendChild(qm);
        const tagS = K.tag(S.ui, { text: "Singularity", x: CX, y: CY + 230, color: "violet", size: 46, pointer: false });
        const EQ = [["E = mc<sup>2</sup>", 300, 560, -6], ["F = ma", 720, 650, 5], ["F = GMm/r<sup>2</sup>", 450, 1015, 3]];
        const tiles = EQ.map(([html, x, y, rot]) => {
          const mk = (clip) => {
            const d = document.createElement("div");
            d.style.cssText = `position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);padding:14px 30px;border-radius:20px;background:#fbf7ee;box-shadow:0 8px 0 #c9c0ae;font:900 54px Nunito,sans-serif;color:#2a2350;white-space:nowrap;opacity:0;clip-path:${clip};`;
            d.innerHTML = html.replace("<sup>", '<sup style="font-size:0.6em;vertical-align:0.7em">');
            S.ui.appendChild(d);
            return d;
          };
          return { x, y, rot, L: mk("inset(-20px 50% -20px -20px)"), Rr: mk("inset(-20px -20px -20px 50%)") };
        });

        // ---------------------------------------------------------------- timing
        const tQ = at("nobody") - 0.1, tLaws = at("laws") - 0.15, tBreak = at("break") - 0.05;
        const st = { q: 0, tiles: 0, tag: 0 };
        tl.to(st, { q: 1, duration: 0.35, ease: "back.out(2.4)" }, tQ);
        tl.to(st, { q: 0, duration: 0.25, ease: "power2.in" }, tLaws - 0.15);
        K.show(tl, tagS, at("there") - 0.05);
        K.hide(tl, tagS, tLaws - 0.2);
        tl.to(st, { tiles: 1, duration: 0.35, ease: "back.out(1.8)" }, tLaws);
        K.camTo(tl, S.cam, 0, { s: 0.85 }, 0.01);                                 // zoom only: HTML labels use the same screen coordinates
        K.camTo(tl, S.cam, 0.05, { s: 1.15 }, tQ, "power2.in");
        K.camTo(tl, S.cam, tQ, { s: 1.0 }, DUR - tQ, "sine.out");

        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t;
          S.sky.update(t);
          centre.k = 0.85 + 0.15 * Math.sin(t * 7) - 0.35 * st.q; centre.update();
          ripples.forEach((c, i) => { const u = (t * 0.8 + i / 4) % 1; c.setAttribute("r", f(30 + 520 * u)); c.setAttribute("opacity", f(0.45 * (1 - u))); });
          sl.forEach((s) => {
            const u = (t * s.sp + s.ph) % 1, d1 = s.d0 * (1 - u), d2 = s.d0 * (1 - Math.min(1, u + 0.12));
            s.el.setAttribute("x1", f(CX + Math.cos(s.a) * d1)); s.el.setAttribute("y1", f(CY + Math.sin(s.a) * d1));
            s.el.setAttribute("x2", f(CX + Math.cos(s.a) * d2)); s.el.setAttribute("y2", f(CY + Math.sin(s.a) * d2));
            s.el.setAttribute("opacity", f(0.5 * Math.sin(Math.PI * u)));
          });
          qm.style.opacity = f(clamp(st.q));
          qm.style.transform = `translate(-50%,-50%) scale(${f(0.4 + 0.6 * st.q)}) rotate(${f(6 * Math.sin(t * 3))}deg)`;
          // equations: drift around the centre, glitch, then split in half and fall away
          tiles.forEach((T, i) => {
            const g = clamp((t - tBreak + 0.35) / 0.35), br = clamp((t - tBreak - i * 0.06) / 0.9);
            const jit = g > 0 && br <= 0 ? Math.sin(t * 90 + i * 7) * 7 : 0;
            const shadow = g > 0 && br < 0.3 ? `${f(4 + jit)}px 0 0 rgba(255,60,90,0.85), ${f(-4 - jit)}px 0 0 rgba(60,220,255,0.85)` : "none";
            const bob = 8 * Math.sin(t * 1.4 + i * 2);
            [[T.L, -1], [T.Rr, 1]].forEach(([el, sd]) => {
              const dx = sd * 40 * sm(br) + jit, dy = 150 * br * br + bob, rot = T.rot + sd * 22 * sm(br);   // small moves: the halves stay in the safe area
              el.style.opacity = f(clamp(st.tiles) * (1 - clamp((br - 0.3) / 0.3)));
              el.style.transform = `translate(-50%,-50%) translate(${f(dx)}px,${f(dy)}px) rotate(${f(rot)}deg) scale(${f(0.6 + 0.4 * st.tiles)})`;
              el.style.textShadow = shadow;
            });
          });
        };
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.55, "4,2,14"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
