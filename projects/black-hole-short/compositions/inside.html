<template id="inside-template">
  <!-- Line 6. "For you, time goes on. Inside, every path leads to the center, and you have only seconds left."
       Back with the astronaut: their own clock ticks on normally (a small inset still shows the friend's frozen,
       red view). Inside the horizon light streams toward the centre; the astronaut fires jets left, right and up,
       but every dotted path bends into the centre. The clock gives way to a countdown: seconds left. -->
  <div data-composition-id="inside" data-width="1080" data-height="1920" data-duration="6.915">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KO = window.OCEAN, KH = window.HUMAN, KS = window.SPACE;
        const ID = "inside", R = document.querySelector('[data-composition-id="inside"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, sm = (x) => x * x * (3 - 2 * x), clamp = (x) => Math.max(0, Math.min(1, x)), rn = K.rng(51);
        const S = KS.stage(R, "in", { seed: 51, bg: ["#1a1040", "#0d0826", "#05030f"], nebula: false, stars: 0.8 });

        // ---------------------------------------------------------------- inside the horizon: light from outside streams in toward the centre
        const CX = 540, CY = 1090;
        const rays = K.g(S.mid);
        const rayList = Array.from({ length: 72 }, (_, i) => {
          const a = -Math.PI / 2 + (rn() - 0.5) * 3.4, d0 = 800 + rn() * 900;
          const el = K.el("line", { stroke: i % 3 ? "#cfd6ff" : "#ffd9a6", "stroke-width": f(2 + rn() * 3), "stroke-linecap": "round", opacity: 0 }, rays);
          return { el, x0: CX + Math.cos(a) * d0, y0: CY + Math.sin(a) * d0 * 1.1, sp: 0.3 + rn() * 0.35, ph: rn(), len: 0.08 + rn() * 0.12 };
        });
        KO.glow(S.far, { x: CX, y: CY, r: 900, color: "blue", p: S.p, core: 0, k: 0.32 });            // a wide, faint glow: the light falling in
        const centre = KO.glow(S.act, { x: CX, y: CY, r: 190, color: "white", p: S.p, core: 10, k: 0.8 });
        const ringC = K.el("circle", { cx: CX, cy: CY, r: 40, fill: "none", stroke: "#ffffff", "stroke-width": 3, opacity: 0.5 }, S.act);

        // ---------------------------------------------------------------- the astronaut, their clock, the paths and the jets
        const AX = 540, AY = 680, AS = 0.55;                            // low enough to clear the countdown
        const pathsG = K.g(S.act);
        const paths = [                                                   // every way they try to go bends to the centre
          `M ${AX - 70} ${AY + 20} C ${AX - 440} ${AY + 20} ${AX - 400} ${CY - 220} ${CX} ${CY}`,
          `M ${AX + 70} ${AY + 20} C ${AX + 440} ${AY + 20} ${AX + 400} ${CY - 220} ${CX} ${CY}`,
          `M ${AX + 20} ${AY - 180} C ${AX + 80} ${AY - 400} ${AX + 360} ${AY - 260} ${AX + 200} ${AY + 120} S ${CX + 40} ${CY - 120} ${CX} ${CY}`,
          `M ${AX - 30} ${AY + 210} C ${AX - 170} ${AY + 330} ${CX - 140} ${CY - 120} ${CX} ${CY}`,
          `M ${AX + 30} ${AY + 210} C ${AX + 170} ${AY + 330} ${CX + 140} ${CY - 120} ${CX} ${CY}`,
        ].map((d, i) => K.el("path", { d, fill: "none", stroke: i === 2 ? "#ffd23f" : "#dfe8ff", "stroke-width": 8, "stroke-linecap": "round", "stroke-dasharray": "2 24", opacity: 0 }, pathsG));
        const puffs = K.g(S.act);
        const puffList = [[-1, 0], [1, 0], [0, -1]].map(([dx, dy]) => ({ dx, dy, els: Array.from({ length: 6 }, () => K.el("circle", { r: 0, fill: "#eef2ff", opacity: 0 }, puffs)) }));
        const aw = K.g(S.act), astro = KH.human(K.g(aw), { look: KS.SUIT });
        const clockG = K.g(S.act, { transform: "translate(845,470)" }), clock = KS.clock(clockG, { r: 62, period: 4 });

        // ---------------------------------------------------------------- the friend's frozen view, for contrast
        const mini = document.createElement("div");
        mini.setAttribute("data-layout-allow-overflow", "");                // its art is cut by the circle on purpose
        mini.style.cssText = "position:absolute;left:130px;top:330px;width:220px;height:220px;border-radius:110px;overflow:hidden;background:#140f3f;box-shadow:0 0 0 8px #ffffff;opacity:0;";
        S.ui.appendChild(mini);
        const msvg = K.el("svg", { viewBox: "-110 -110 220 220", width: 220, height: 220, style: "position:absolute;inset:0" });
        mini.appendChild(msvg);
        const mdefs = K.el("defs", {}, msvg); KO.glowDefs(mdefs, "inm");
        KS.blackHole(K.g(msvg, { transform: "translate(0,1000)" }), { R: 930, p: "inm", seed: 8, disk: 0.6 }).update(0);
        K.el("line", { x1: -110, y1: 72, x2: 110, y2: 72, stroke: "#ffffff", "stroke-width": 3, "stroke-dasharray": "10 7" }, msvg);
        const mAstro = KH.human(K.g(msvg, { transform: "translate(0,62) scale(0.2)", opacity: 0.4 }), { look: KS.SUIT });
        mAstro.setPose(KS.floatPose(4.6, { arms: "relax" }));
        const mRed = document.createElement("div");
        mRed.style.cssText = "position:absolute;inset:0;background:#ff3020;mix-blend-mode:multiply;opacity:0.88;";
        mini.appendChild(mRed);
        const mPause = document.createElement("div");
        mPause.style.cssText = "position:absolute;left:84px;top:66px;width:52px;height:60px;";
        mPause.innerHTML = '<div style="position:absolute;left:4px;top:0;width:15px;height:60px;border-radius:6px;background:#fff"></div><div style="position:absolute;left:33px;top:0;width:15px;height:60px;border-radius:6px;background:#fff"></div>';
        mini.appendChild(mPause);
        const tagM = K.tag(S.ui, { text: "Friend's view", x: 245, y: 615, color: "red", size: 34, pointer: false });

        // ---------------------------------------------------------------- countdown and the centre's label
        const cd = document.createElement("div");
        cd.style.cssText = "position:absolute;left:540px;top:382px;transform:translate(-50%,-50%);padding:8px 32px;border-radius:24px;background:rgba(20,8,30,0.85);box-shadow:0 0 0 6px #ff6a3d;font:900 96px/1 Nunito,sans-serif;color:#ffb27f;letter-spacing:0.02em;opacity:0;";
        cd.textContent = "0:12";
        S.ui.appendChild(cd);
        const tagC = K.tag(S.ui, { text: "Center", x: CX + 130, y: CY - 40, color: "violet", size: 46 });

        // ---------------------------------------------------------------- timing
        const tIn = at("inside"), tPath = at("every"), tCen = at("center"), tSec = at("only") - 0.15;
        const st = { mini: 0, paths: 0, cd: 0, worry: 0, clock: 1, rays: 0 };
        tl.to(st, { mini: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.15);
        tl.to(st, { mini: 0, duration: 0.25, ease: "power2.in" }, tIn - 0.2);
        K.show(tl, tagM, 0.25);
        K.hide(tl, tagM, tIn - 0.2);
        tl.to(st, { rays: 1, duration: 0.6 }, tIn - 0.3);
        tl.to(st, { paths: 1, duration: 1.4, ease: "power1.inOut" }, tPath - 0.1);
        tl.to(st, { worry: 1, duration: 0.4 }, at("leads"));
        K.show(tl, tagC, tCen - 0.08);
        K.hide(tl, tagC, tSec - 0.1);
        tl.to(st, { clock: 0, duration: 0.25 }, tSec - 0.2);
        tl.to(st, { cd: 1, duration: 0.3, ease: "back.out(2)" }, tSec);
        const jets = [tPath + 0.05, tPath + 0.45, tPath + 0.85];          // left, right, up
        K.camTo(tl, S.cam, 0, { s: 1.0, py: 960 }, 0.01);
        K.camTo(tl, S.cam, 0.02, { s: 1.04 }, DUR - 0.02, "sine.inOut");

        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t;
          S.sky.update(t);
          centre.k = 0.75 + 0.15 * Math.sin(t * 5); centre.update();
          const ru = (t * 0.7) % 1;
          ringC.setAttribute("r", f(40 + 140 * ru)); ringC.setAttribute("opacity", f(0.5 * (1 - ru)));
          rayList.forEach((r) => {
            const u = (t * r.sp + r.ph) % 1, b = Math.min(1, u + r.len);
            r.el.setAttribute("x1", f(r.x0 + (CX - r.x0) * u)); r.el.setAttribute("y1", f(r.y0 + (CY - r.y0) * u));
            r.el.setAttribute("x2", f(r.x0 + (CX - r.x0) * b)); r.el.setAttribute("y2", f(r.y0 + (CY - r.y0) * b));
            r.el.setAttribute("opacity", f((0.3 + 0.5 * st.rays) * Math.sin(Math.PI * u)));
          });
          // the astronaut: calm at first, then jets in three directions that change nothing
          let nx = 0, ny = 0;
          jets.forEach((j, i) => { const u = clamp((t - j) / 0.45); nx += puffList[i].dx * -30 * Math.sin(Math.PI * u); ny += puffList[i].dy * -30 * Math.sin(Math.PI * u); });
          aw.setAttribute("transform", `translate(${f(AX + nx)},${f(AY + ny)}) rotate(${f(4 * Math.sin(t * 1.1))}) scale(${AS}) translate(0,356)`);
          astro.setPose(KS.floatPose(t, { arms: st.worry > 0.5 ? "out" : "relax", amp: 1 }));
          astro.setFace({ brow: 0.9 * st.worry, mouth: 1 - 1.3 * st.worry, eye: 0.85 + 0.5 * st.worry, open: 0.35 * st.worry });
          puffList.forEach((p, i) => p.els.forEach((c, k) => {
            const u = clamp((t - jets[i] - k * 0.035) / 0.55), d = 90 + 160 * u, spread = (k - 2.5) * 12;
            c.setAttribute("cx", f(AX + nx + p.dx * d + (p.dy ? spread : 0))); c.setAttribute("cy", f(AY + ny + p.dy * (d + 60) + (p.dx ? spread : 0)));
            c.setAttribute("r", f(12 + 26 * u)); c.setAttribute("opacity", f(u > 0 && u < 1 ? 0.85 * (1 - u) : 0));
          }));
          paths.forEach((el, i) => {
            const u = clamp(st.paths * 1.6 - i * 0.15);
            el.setAttribute("opacity", f(0.9 * u));
            el.setAttribute("stroke-dashoffset", f(-t * 70));            // dots flow toward the centre
          });
          clock.set(t);                                                    // your own time runs normally
          clockG.setAttribute("opacity", f(st.clock));
          mini.style.opacity = f(clamp(st.mini)); mini.style.transform = `scale(${f(0.5 + 0.5 * st.mini)})`;
          cd.style.opacity = f(clamp(st.cd)); cd.style.transform = `translate(-50%,-50%) scale(${f(0.6 + 0.4 * st.cd)})`;
          cd.textContent = "0:" + String(Math.max(0, 12 - Math.floor(Math.max(0, t - tSec)))).padStart(2, "0");
        };
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.55, "4,2,14"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
