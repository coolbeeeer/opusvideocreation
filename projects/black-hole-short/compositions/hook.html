<template id="hook-template">
  <!-- Line 1. "What happens if you fall into a black hole? It depends on how big it is."
       An astronaut falls feet first through space; the camera falls with them until a glowing black hole fills the
       bottom of the frame. On "It depends" the camera pulls back and a giant black hole looms beside the small one. -->
  <div data-composition-id="hook" data-width="1080" data-height="1920" data-duration="4.88">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        const K = window.KIT, KP = window.KITPLUS, KH = window.HUMAN, KS = window.SPACE;
        const ID = "hook", R = document.querySelector('[data-composition-id="hook"]');
        const T0 = K.scene(ID).start, DUR = K.scene(ID).dur;
        const at = (w, n = 1) => K.t(w, n, T0) - T0;
        const tl = gsap.timeline({ paused: true });
        const f = K.f, sm = (x) => x * x * (3 - 2 * x), clamp = (x) => Math.max(0, Math.min(1, x));
        const S = KS.stage(R, "hk", { seed: 11 });

        // ---------------------------------------------------------------- world: a small black hole below, a giant one far off to the lower right
        const SX = 430, SY = 1420, SR = 150, GX = 1650, GY = 2650, GR = 1050;
        const gG = K.g(S.act, { transform: `translate(${GX},${GY})`, opacity: 0 });         // revealed on "It depends"
        const bhG = KS.blackHole(gG, { R: GR, p: S.p, seed: 2, glow: 0.45 });
        const bhS = KS.blackHole(K.g(S.act, { transform: `translate(${SX},${SY})` }), { R: SR, p: S.p, seed: 1 });
        const aw = K.g(S.act), astro = KH.human(K.g(aw), { look: KS.SUIT });
        const AS = 0.8;                                           // astronaut scale; local y -356 is mid-body
        const ay = (t) => 360 + 430 * sm(clamp(t / 3.4));         // falling feet first toward the small hole
        // speed streaks in the near layer sell the fall
        const rn = K.rng(12);
        for (let i = 0; i < 26; i++) {
          const x = -200 + rn() * 1500, y = -300 + rn() * 2600, h = 40 + rn() * 90;
          K.el("line", { x1: f(x), y1: f(y), x2: f(x), y2: f(y + h), stroke: "#dfe8ff", "stroke-width": f(2 + rn() * 2), "stroke-linecap": "round", opacity: f(0.18 + rn() * 0.2) }, S.near);
        }

        // ---------------------------------------------------------------- camera keys [t, scale, x, y]: fall with the astronaut, then pull back on "It depends"
        const tDep = at("depends");
        const CK = [[0, 1.0, 540, 600], [2.1, 1.0, 540, 980], [tDep - 0.1, 1.0, 540, 1010], [tDep + 0.95, 0.42, 1000, 1620], [DUR, 0.4, 1010, 1640]];
        const camAt = (t) => {
          for (let i = 0; i < CK.length - 1; i++) if (t <= CK[i + 1][0]) { const u = sm(clamp((t - CK[i][0]) / (CK[i + 1][0] - CK[i][0]))); return [1, 2, 3].map((k) => CK[i][k] + (CK[i + 1][k] - CK[i][k]) * u); }
          return CK[CK.length - 1].slice(1);
        };

        // ---------------------------------------------------------------- labels
        const q = K.tag(S.ui, { text: "?", x: 0, y: 0, color: "violet", size: 70 });
        K.show(tl, q, at("hole") - 0.05);
        K.hide(tl, q, tDep - 0.1);
        const tagS = S.cam.pin(K.tag(S.ui, { text: "Small", x: 0, y: 0, color: "violet", size: 52, pointer: false }), SX, SY + 300);
        K.show(tl, tagS, at("big") - 0.05);
        const tagG = S.cam.pin(K.tag(S.ui, { text: "Giant", x: 0, y: 0, color: "crimson", size: 60 }), 1390, 1060);
        K.show(tl, tagG, at("it", 2) - 0.05);

        // ---------------------------------------------------------------- expressions over time (tweened numbers)
        const st = { brow: 0.6, open: 0, eye: 1, mouth: -0.1 };
        tl.to(st, { eye: 1.35, open: 0.45, brow: 1, duration: 0.25 }, at("black") - 0.05);
        tl.to(st, { eye: 1.0, open: 0, brow: 0.3, mouth: 0.2, duration: 0.3 }, tDep - 0.05);
        tl.to(st, { eye: 1.4, open: 0.6, brow: 1, duration: 0.2 }, at("big") - 0.1);

        const clk = { t: 0 };
        const frame = () => {
          const t = clk.t;
          S.sky.update(t); bhS.update(t); bhG.update(t * 0.4);
          const rv = sm(clamp((t - tDep + 0.15) / 0.8));
          gG.setAttribute("opacity", f(rv)); gG.setAttribute("transform", `translate(${GX},${GY}) scale(${f(0.82 + 0.18 * rv)})`);
          const [cs, cx, cy] = camAt(t);
          S.cam.s = cs; S.cam.px = cx; S.cam.py = cy; S.cam.apply();
          const y = ay(t), rot = 9 * Math.sin(t * 1.3) + 4 * Math.sin(t * 2.9);
          aw.setAttribute("transform", `translate(${SX},${f(y)}) rotate(${f(rot)}) scale(${AS}) translate(0,356)`);
          astro.setPose(KS.floatPose(t, { arms: "out", amp: 1.4 }));
          astro.setFace({ brow: st.brow, open: st.open, eye: st.eye, mouth: st.mouth });
          const hd = S.cam.toScreen(SX + 190, y - 200 * AS);                       // beside the helmet (above it would leave the safe area)
          q.style.left = f(hd[0]) + "px"; q.style.top = f(hd[1]) + "px";
        };
        frame();
        tl.eventCallback("onUpdate", () => { clk.t = tl.time(); frame(); });
        S.stage.insertBefore(KP.vignette(S.stage, 0.5, "6,4,20"), S.ui);

        tl.set({}, {}, DUR);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
